name = "my-ai-worker"
main = "src/index.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[placement]
region = "gcp:us-central1"

[observability]
enabled = true

# ====================================================================
# Free tier D1/KV/Queues/Vectorize/R2 (tra cứu 11/09/2026 tại
# https://developers.cloudflare.com/workers/platform/pricing) — không cần
# thẻ/billing để dùng ở mức nhỏ:
#   R2:        10 GB lưu trữ / tháng
#   D1:        5 GB, 5 triệu dòng đọc/ngày, 100.000 dòng ghi/ngày
#   KV:        1 GB, 100.000 lượt đọc/ngày, 1.000 lượt ghi/ngày
#   Queues:    10.000 operations/ngày (tin nhắn giữ tối đa 24h)
#   Vectorize: 30 triệu "queried dimensions"/tháng, 5 triệu "stored dimensions"
# App cá nhân dùng bình thường sẽ không chạm các giới hạn này.
# =====================================================================
 
[browser]
binding = "MYBROWSER"

[[d1_databases]]
binding = "MY_AI_DB"
database_name = "my-ai-db"
database_id = "70fd971e-3152-43f1-bad4-4353e5762da5"

[[kv_namespaces]]
binding = "MY_AI_KV"
id = "57e00036a30b45a2821cb29a18e80f76"

[[queues.producers]]
binding = "VIDEO_QUEUE"
queue = "my-ai-video-queue"

[[queues.consumers]]
queue = "my-ai-video-queue"
max_batch_size = 1
max_retries = 2
dead_letter_queue = "my-ai-video-queue-dlq"

[[vectorize]]
binding = "MY_AI_VECTORIZE"
index_name = "my-ai-chat-index"

[[analytics_engine_datasets]]
binding = "MY_AI_ANALYTICS"
dataset = "my_ai_metrics"

[vars]
GOOGLE_CLIENT_ID = "752017566752-vbdlh19akir9mt8bmk1derla59fp3h22.apps.googleusercontent.com"
OWNER_USER_ID = "117195311521159900631"

API_BASE_URL = "https://my-ai-worker.vudanhquy1002.workers.dev"
APP_URL = "https://toilalode.github.io"

name = "GEMINI_PROXY"
class_name = "GeminiProxyDO"

[[durable_objects.bindings]]
name = "GEMINI_LIVE"
class_name = "GeminiLiveDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GeminiProxyDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["GeminiLiveDO"]
